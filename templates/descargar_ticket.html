{% extends "base.html" %}

{% block title %}Descargando Ticket{% endblock %}

{% block content %}

    <div style="text-align: center; padding: 40px; min-height: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <h2>✅ Ticket descargando...</h2>
        <p style="font-size: 16px; color: #666; margin-top: 20px;">
            Tu ticket está siendo descargado automáticamente.<br>
            En unos momentos serás redirigido al carrito.
        </p>
        <div style="margin-top: 30px; font-size: 48px;">📄</div>
        <p style="margin-top: 20px; color: #999; font-size: 14px;">
            Si la descarga no comienza automáticamente, <a href="{{ url_for('generar_pdf_ticket') }}" style="color: #36195d; text-decoration: underline;">haz clic aquí</a>
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Generar la URL para descargar el PDF
            const pdfUrl = "{{ url_for('generar_pdf_ticket') }}";
            
            // Crear un elemento <a> invisible y hacer clic para descargar
            const link = document.createElement('a');
            link.href = pdfUrl;
            link.download = 'ticket.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // Redirigir al carrito después de 2 segundos
            setTimeout(() => {
                window.location.href = "{{ url_for('carrito') }}";
            }, 2000);
        });
    </script>

{% endblock %}
