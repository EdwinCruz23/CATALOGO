{% extends "base.html" %}

{% block title %}Finalizar Compra{% endblock %}

{% block content %}

    <h2 class="page-title">✅ Datos de Envío y Contacto</h2>

    <div class="checkout-form-container">
        
        <form action="{{ url_for('comprar') }}" method="POST" class="standard-form">
            
            <h3>🗃️ Información del Cliente (Registrada)</h3>
            
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" class="form-control" required>
            </div>
            
            <hr>
            <h3>🏠 Datos de Envío</h3>

            <div class="form-group">
                <label for="calle">Calle:</label>
                <input type="text" id="calle" name="calle" class="form-control" placeholder="Ej: Av. Juárez" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="num_ext">Número Exterior:</label>
                    <input type="text" id="num_ext" name="num_ext" class="form-control" placeholder="Ej: 105" required>
                </div>
                <div class="form-group">
                    <label for="num_int">Número Interior (Opcional):</label>
                    <input type="text" id="num_int" name="num_int" class="form-control" placeholder="Ej: A-3">
                </div>
            </div>

            <div class="form-group">
                <label for="CP">Código Postal:</label>
                <input type="text" id="CP" name="CP" class="form-control" placeholder="Ej: 52000" required>
            </div>

            <hr>
            <h3>💰 Método de Pago</h3>

            <div class="form-group">
                <label for="metodo_pago">Selecciona Método de Pago:</label>
                <select id="metodo_pago" name="metodo_pago" class="form-control" required>
                    <option value="" disabled selected>---</option>
                    <option value="Tarjeta de Crédito/Débito">💳 Tarjeta de Crédito/Débito</option>
                    <option value="Efectivo">💵 Efectivo</option>
                </select>
            </div>

            <div id="campos_tarjeta">
                <h4>Detalles de la Tarjeta</h4>
                
                <div class="form-group">
                    <label for="num_tarjeta">Número de Tarjeta:</label>
                    <input type="tel" id="num_tarjeta" name="num_tarjeta" class="form-control" 
                           placeholder="xxxx xxxx xxxx xxxx" required disabled>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cvc">CVC/CVV:</label>
                        <input type="text" id="cvc" name="cvc" class="form-control" 
                               placeholder="123" pattern="[0-9]{3,4}" maxlength="4" required disabled>
                    </div>
                    
                    <div class="form-group">
                        <label for="fecha_caducidad">Fecha de Caducidad:</label>
                        <input type="text" id="fecha_caducidad" name="fecha_caducidad" class="form-control" 
                               placeholder="MM/AA" pattern="(0[1-9]|1[0-2])\/?([0-9]{2}|[0-9]{4})" required disabled>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn-primary btn-full-width">
                Finalizar Compra y Generar Ticket
            </button>
        </form>
    </div>

    <script>
        // --- Lógica de JavaScript para mostrar/ocultar campos ---

        // 1. Obtener referencias a los elementos clave
        const metodoPagoSelect = document.getElementById('metodo_pago');
        const camposTarjetaDiv = document.getElementById('campos_tarjeta');
        const camposRequeridos = camposTarjetaDiv.querySelectorAll('input[required]');

        // Función que maneja la visibilidad y el estado 'required'
        function toggleCamposTarjeta() {
            // El valor seleccionado en el dropdown
            const valorSeleccionado = metodoPagoSelect.value;
            
            // Si elige Tarjeta de Crédito/Débito
            const esTarjeta = (valorSeleccionado === 'Tarjeta de Crédito/Débito');

            if (esTarjeta) {
                // Mostrar el contenedor
                camposTarjetaDiv.style.display = 'block';
                // Habilitar y hacer requeridos los campos de la tarjeta
                camposRequeridos.forEach(campo => {
                    campo.removeAttribute('disabled');
                });
            } else {
                // Ocultar el contenedor
                camposTarjetaDiv.style.display = 'none';
                // Deshabilitar (para que no se envíen) y quitar el requisito
                camposRequeridos.forEach(campo => {
                    campo.setAttribute('disabled', 'true');
                });
            }
        }

        // 2. Escuchar el evento 'change' en el select de método de pago
        metodoPagoSelect.addEventListener('change', toggleCamposTarjeta);

        
        window.onload = toggleCamposTarjeta; 
    </script>

{% endblock %}
